name: todo-app

services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      # Bind mounts from Windows/macOS hosts do not deliver fs events into the VM.
      WATCHFILES_FORCE_POLLING: "true"
    volumes:
      - ./backend:/app
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    environment:
      API_PROXY_TARGET: http://backend:8000
      VITE_USE_POLLING: "true"
    volumes:
      - ./frontend:/app
      # Keep the Linux node_modules from the image instead of the host's.
      - /app/node_modules
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5173').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    depends_on:
      backend:
        condition: service_healthy
