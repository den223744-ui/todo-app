name: todo-app

services:
  backend:
    build: ./backend
    # Bring the schema up to date before serving (idempotent).
    command: sh -c "alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    ports:
      - "8000:8000"
    environment:
      # Bind mounts from Windows/macOS hosts do not deliver fs events into the VM.
      WATCHFILES_FORCE_POLLING: "true"
      # SQLite in a named volume: survives restarts, stays out of the source tree.
      DATABASE_URL: sqlite+aiosqlite:////data/todo.db
    volumes:
      - ./backend:/app
      - backend-data:/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  frontend:
    build: ./frontend
    # node_modules lives in an anonymous volume, which compose keeps across
    # container re-creation: sync it with package-lock.json on every start so
    # newly added packages appear (a no-op of a few seconds when nothing changed).
    command: sh -c "npm install --no-audit --no-fund && exec npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    environment:
      API_PROXY_TARGET: http://backend:8000
      VITE_USE_POLLING: "true"
    volumes:
      - ./frontend:/app
      # Keep the Linux node_modules from the image instead of the host's.
      - /app/node_modules
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5173').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    depends_on:
      backend:
        condition: service_healthy

volumes:
  backend-data:
