<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Keep key/validation in sync with src/domain/theme.ts and themeStore.ts.
      try {
        const theme = localStorage.getItem('tood-theme');
        if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme;
        else document.documentElement.removeAttribute('data-theme');
      } catch {
        document.documentElement.removeAttribute('data-theme');
      }
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TOOD — список дел</title>
    <meta
      name="description"
      content="Личный список дел: быстрый ввод, сроки и таймлайн дня. Без регистрации, список остаётся после обновления страницы."
    />
    <meta name="theme-color" content="#f9f4f1" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1a1715" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" sizes="any" />
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta property="og:title" content="TOOD — список дел" />
    <meta
      property="og:description"
      content="Личный список дел: быстрый ввод, сроки и таймлайн дня. Без регистрации, список остаётся после обновления страницы."
    />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="ru_RU" />
    <meta property="og:image" content="/apple-touch-icon.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
