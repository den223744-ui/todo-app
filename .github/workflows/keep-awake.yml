name: Keep the demo awake

# Render's free plan puts the service to sleep after 15 idle minutes, and the
# first visitor then waits about a minute. A request every 10 minutes keeps it
# up; one always-on service fits in the free 750 instance hours a month.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping the health check (waits out a cold start)
        run: curl --fail --silent --show-error --retry 5 --retry-delay 20 --retry-all-errors --max-time 90 https://tood-rfky.onrender.com/api/health
