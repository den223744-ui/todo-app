name: CI

on:
  push:
    branches: [main, 'stage-*']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (ruff, mypy, pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest

  frontend:
    name: Frontend (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Lowest version allowed by package.json "engines", plus the current LTS.
        node: ['22.13.0', '24']
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    name: E2E (playwright)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

  compose:
    name: docker compose smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker compose up --build --detach --wait --wait-timeout 180
      - name: Backend health through its own port
        run: curl --fail --silent http://localhost:8000/api/health
      - name: Backend health through the Vite proxy
        run: curl --fail --silent http://localhost:5173/api/health
      - name: Frontend serves index.html
        run: curl --fail --silent http://localhost:5173/ | grep -q '<div id="root">'
      - name: Task survives a backend restart (session cookie, migrations, volume)
        run: |
          set -euo pipefail
          jar=$(mktemp)
          api=http://localhost:5173/api/tasks
          curl --fail --silent -c "$jar" -b "$jar" "$api" | grep -qx '\[\]'
          curl --fail --silent -c "$jar" -b "$jar" -H 'content-type: application/json' \
            -d '{"title":"smoke","tags":["#CI"]}' "$api" | grep -q '"tags":\["ci"\]'
          docker compose restart backend
          docker compose up --wait --wait-timeout 120
          curl --fail --silent -b "$jar" "$api" | grep -q '"title":"smoke"'
      - if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down --volumes
